  <div class="container">
    <div class="foot">
      <a href="/" aria-label="TUXO – zur Startseite">
        <img class="logo-dark" src="{{ '/assets/brand-d/logo-claim-white.svg' | relative_url }}" alt="TUXO – Ihre IT. Ihre Daten." width="144" height="46">
        <img class="logo-light" src="{{ '/assets/brand-d/logo-claim.svg' | relative_url }}" alt="TUXO – Ihre IT. Ihre Daten." width="144" height="46">
      </a>
      <nav aria-label="Fusszeile">
        <a href="/">Startseite</a>
        <a href="{{ '/' | relative_url }}">Blog</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS-Feed</a>

      </nav>

  </div>

<script>
(function(){
  var root=document.documentElement,toggle=document.getElementById('themeToggle');
  function apply(t,persist){var b=t==='bright';root.setAttribute('data-theme',b?'bright':'dark');toggle.setAttribute('aria-pressed',String(b));if(persist){try{localStorage.setItem('tuxo-theme',b?'bright':'dark')}catch(e){}}}
  toggle.addEventListener('click',function(){apply(root.getAttribute('data-theme')==='dark'?'bright':'dark',true)});
  apply(root.getAttribute('data-theme'),false);
  var burger=document.querySelector('.burger'),menu=document.getElementById('menu');
  function setMenu(o){menu.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);burger.setAttribute('aria-label',o?'Menü schliessen':'Menü öffnen')}
  burger.addEventListener('click',function(){setMenu(!menu.classList.contains('open'))});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&menu.classList.contains('open')){setMenu(false);burger.focus()}});
  document.querySelectorAll('[data-more]').forEach(function(btn){
    var list=document.getElementById(btn.getAttribute('data-more'));if(!list)return;
    var size=parseInt(list.getAttribute('data-page-size'),10)||9,items=[].slice.call(list.children),shown=size;
    function update(){items.forEach(function(li,i){li.hidden=i>=shown});btn.hidden=shown>=items.length}
    btn.addEventListener('click',function(){var first=items[shown];shown+=size;update();if(first){var a=first.querySelector('a');if(a)a.focus()}});
    update();
  });
})();
</script>
