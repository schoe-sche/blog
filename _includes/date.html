{%- assign m = "Januar,Februar,März,April,Mai,Juni,Juli,August,September,Oktober,November,Dezember" | split: "," -%}
{%- assign mi = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date: '%Y-%m-%d' }}">{{ include.date | date: "%-d." }} {{ m[mi] }} {{ include.date | date: "%Y" }}</time>
